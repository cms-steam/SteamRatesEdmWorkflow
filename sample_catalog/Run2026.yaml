               /EphemeralHLTPhysics6/Run2026D-v1/RAW, /EphemeralHLTPhysics7/Run2026D-v1/RAW]
    selection_paths: [HLT_EphemeralPhysics]
    inputs: ["/eos/cms/store/data/Run2026D/EphemeralHLTPhysics[0-7]/RAW/v1/000/403/663/00000/*.root"]
    lumi_json: json/json_403663.txt
    normalization: {mode: data, prescale: 220, n_datasets: 8, lumi: 2.2}   # legacy hlt_ps 1760 = 220 x 8

