# STEAM sample catalog: Run-2026 collision data.
# The schema is documented in steamrates/catalog.py. Browse with: python3 -m steamrates catalog list
# Lumi is in units of 1e34 cm^-2 s^-1. "prescale" is the prescale of each of the n_datasets datasets
# (the legacy hlt_ps); together they record 1 in prescale/n_datasets events.

raw:
  Run2026B_402360_EphemeralHLTPhysics:
    type: data
    description: EphemeralHLTPhysics0-7 RAW, run 402360, LS 193-334
    datasets: [/EphemeralHLTPhysics0/Run2026B-v1/RAW, /EphemeralHLTPhysics1/Run2026B-v1/RAW,
               /EphemeralHLTPhysics2/Run2026B-v1/RAW, /EphemeralHLTPhysics3/Run2026B-v1/RAW,
               /EphemeralHLTPhysics4/Run2026B-v1/RAW, /EphemeralHLTPhysics5/Run2026B-v1/RAW,
               /EphemeralHLTPhysics6/Run2026B-v1/RAW, /EphemeralHLTPhysics7/Run2026B-v1/RAW]
    inputs: []        # the RAW files are no longer on /eos/cms (checked 2026-11-11)
    lumi_json: json/json_402360.txt
    normalization: {mode: data, prescale: 480, n_datasets: 8, lumi: 2.2}

  Run2026D_403663_EphemeralHLTPhysics:
    type: data
    description: EphemeralHLTPhysics0-7 RAW, run 403663 (PU 63.9), LS 400-1700
    datasets: [/EphemeralHLTPhysics0/Run2026D-v1/RAW, /EphemeralHLTPhysics1/Run2026D-v1/RAW,
